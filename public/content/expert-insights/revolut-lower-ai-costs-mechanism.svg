<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Five steps in sequence: lower cost per AI task, fewer usage constraints, broader agent adoption, AI support extends beyond coding, potential reductions in coordination effort and lead time.">
  <rect width="800" height="590" rx="12" fill="#0B1220"/>
  <defs>
    <marker id="head" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <g fill="#111C2E" stroke="#0EA5E9" stroke-width="2">
    <rect x="40" y="24" width="720" height="72" rx="14"/>
    <rect x="40" y="126" width="720" height="72" rx="14"/>
    <rect x="40" y="228" width="720" height="72" rx="14"/>
    <rect x="40" y="330" width="720" height="72" rx="14"/>
  </g>
  <rect x="40" y="432" width="720" height="134" rx="14" fill="#1F1A10" stroke="#F59E0B" stroke-width="2"/>
  <g stroke="#9CA3AF" stroke-width="3" marker-end="url(#head)">
    <line x1="400" y1="97" x2="400" y2="119"/>
    <line x1="400" y1="199" x2="400" y2="221"/>
    <line x1="400" y1="301" x2="400" y2="323"/>
    <line x1="400" y1="403" x2="400" y2="425"/>
  </g>
  <g fill="#F3F4F6" font-size="32" font-weight="600" text-anchor="middle">
    <text x="400" y="71">Lower cost per AI task</text>
    <text x="400" y="173">Fewer usage constraints</text>
    <text x="400" y="275">Broader agent adoption</text>
    <text x="400" y="377">AI support extends beyond coding</text>
    <text x="400" y="488">Potential reductions in</text>
    <text x="400" y="530">coordination effort and lead time</text>
  </g>
</svg>
