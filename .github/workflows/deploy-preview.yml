name: Deploy Radar Preview

# The preview is the same commit as production, built with a different base and
# with drafts visible, published into the preview/ folder of the same Pages
# deployment. It tracks main so that what reviewers see is what will ship:
# going live is publishing the tenth phenomenon, not migrating anything.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Both this workflow and deploy.yml commit to gh-pages on a push to main.
# Without a shared group they interleave and one of them loses.
concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Puppeteer system dependencies
        run: npx puppeteer browsers install chrome

      - name: Build preview
        env:
          VITE_RADAR_PREVIEW: "1"
        run: npm run build:preview

      # The radar is verified against the artefact about to be deployed, not
      # against a dev server. Four of these checks exist because screenshots
      # caught defects the DOM checks had missed.
      - name: Verify the radar
        run: |
          # --strictPort: without it Vite silently moves to the next free port
          # and the harness would verify whatever else is listening on 5199.
          npx vite preview --base=/FoSW/preview/ --port 5199 --strictPort &
          for i in $(seq 1 30); do
            curl -sfo /dev/null http://localhost:5199/FoSW/preview/ && break
            sleep 2
          done
          node scripts/verify-radar.mjs http://localhost:5199/FoSW/preview/

      - name: Deploy preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          target-folder: preview
